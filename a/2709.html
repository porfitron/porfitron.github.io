<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>3D Apartment Walkthrough - Unit 2709 (Fireplace Added)</title>
    <meta name="description" content="3D Apartment Layout using A-Frame">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    
    <style>
      #instructions {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        padding: 15px;
        font-family: sans-serif;
        border-radius: 5px;
        z-index: 999;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    
    <div id="instructions">
      <h2>Unit 2709 Tour</h2>
      <p>Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to move.</p>
      <p><strong>Click & Drag</strong> to look around.</p>
      <p><i>Collision disabled: You can walk through walls but stay on the floor.</i></p>
    </div>

    <a-scene background="color: #ECECEC">
      
      <!-- ASSETS -->
      <a-assets>
        <img id="floor-texture" src="https://cdn.aframe.io/a-painter/images/floor.jpg" crossorigin="anonymous">
        <a-mixin id="window-glass" material="opacity: 0.3; color: #88ccee; transparent: true; side: double"></a-mixin>
        <!-- Wall Material -->
        <a-mixin id="wall" geometry="depth: 0.3" material="color: #FFF"></a-mixin>
        <a-mixin id="ext-wall" geometry="depth: 0.3" material="color: #7d7d7d"></a-mixin>
      </a-assets>

      <!-- LIGHTING -->
      <a-entity position="0 4 -5" light="type: point; intensity: 0.4; castShadow: true"></a-entity>
      <a-entity position="5 4 8" light="type: point; intensity: 0.4"></a-entity>
      <a-entity position="-5 4 8" light="type: point; intensity: 0.4"></a-entity>
      <a-entity light="type: ambient; intensity: 0.6; color: #BBB"></a-entity>

      <!-- VISUAL FLOOR -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="60" height="90" color="#DCC7AA"></a-plane>

      <!-- === NAVIGATION MESH (Walkable Areas) === -->
      <a-entity id="nav-mesh-group">
        
        <!-- Hallway (The Spine) -16 to +6 -->
        <a-plane nav-mesh visible="false" rotation="-90 0 0" position="0 0.01 -5" width="2.3" height="22" color="red"></a-plane>

        <!-- West Rooms -->
        <a-plane nav-mesh visible="false" rotation="-90 0 0" position="-3.5 0.01 -14" width="5" height="3" color="red"></a-plane> <!-- Bath -->
        <a-plane nav-mesh visible="false" rotation="-90 0 0" position="-3.5 0.01 -10.5" width="5" height="3" color="red"></a-plane> <!-- Laundry -->
        <a-plane nav-mesh visible="false" rotation="-90 0 0" position="-4.5 0.01 -5.5" width="7" height="6.5" color="red"></a-plane> <!-- Kitchen -->
        <a-plane nav-mesh visible="false" rotation="-90 0 0" position="-4.5 0.01 3.5" width="7" height="9" color="red"></a-plane> <!-- Dining -->

        <!-- East Rooms -->
        <a-plane nav-mesh visible="false" rotation="-90 0 0" position="4.5 0.01 -10.5" width="7" height="7" color="red"></a-plane> <!-- Bed 1 -->
        <a-plane nav-mesh visible="false" rotation="-90 0 0" position="4.5 0.01 -5.5" width="6" height="3" color="red"></a-plane> <!-- Ensuite -->
        <a-plane nav-mesh visible="false" rotation="-90 0 0" position="4.5 0.01 -1.5" width="7" height="4.5" color="red"></a-plane> <!-- Bed 2 -->
        <a-plane nav-mesh visible="false" rotation="-90 0 0" position="4.5 0.01 4.5" width="7" height="7" color="red"></a-plane> <!-- Living -->

      </a-entity>

      <!-- === ENTRANCE LABEL === -->
      <a-text value="Entrance" position="0 2 -16" align="center" color="#333" rotation="0 180 0"></a-text>

      <!-- === WEST SIDE STRUCTURE (Left) === -->

      <!-- 1. MAIN BATHROOM (-16 to -12) -->
      <a-text value="Main Bath" position="-3.5 2.5 -14" align="center" color="#333"></a-text>
      <a-box mixin="ext-wall" position="-3.8 1.5 -16.15" width="8" height="3"></a-box> 
      <a-box mixin="ext-wall" position="-7.65 1.5 -14.15" width="0.3" height="3" depth="4.3"></a-box>
      <!-- Hallway Walls -->
      <a-box mixin="wall" position="-1.5 1.5 -15" width="0.3" height="3" depth="2"></a-box> 
      <a-box mixin="wall" position="-1.5 2.5 -13" width="0.3" height="1" depth="2"></a-box> 
      <a-box mixin="wall" position="-1.5 1.5 -12.5" width="0.3" height="3" depth="1"></a-box>
      <!-- Wall blocking fix from previous step -->
      <a-box mixin="wall" position="-4.6 1.5 -12" width="6.2" height="3"></a-box>
      <a-cylinder position="-5 0.4 -15" radius="0.3" height="0.6" color="white"></a-cylinder>

      <!-- 2. LAUNDRY ROOM (-12 to -9) -->
      <a-text value="Laundry" position="-3.5 2.5 -10.5" align="center" color="#333"></a-text>
      <a-box mixin="ext-wall" position="-7.65 1.5 -10.5" width="0.3" height="3" depth="3"></a-box>
      <!-- Hallway Walls -->
      <a-box mixin="wall" position="-1.5 1.5 -11.5" width="0.3" height="3" depth="1"></a-box>
      <a-box mixin="wall" position="-1.5 2.5 -10.5" width="0.3" height="1" depth="1"></a-box> 
      <a-box mixin="wall" position="-1.5 1.5 -9.5" width="0.3" height="3" depth="1"></a-box>
      <!-- Wall blocking fix from previous step -->
      <a-box mixin="wall" position="-4.6 1.5 -9" width="6.2" height="3"></a-box>
      <a-box position="-4.5 0.5 -10.5" width="1.5" height="1" depth="1" color="white"></a-box>

      <!-- 3. KITCHEN (-9 to -2) -->
      <a-text value="Kitchen" position="-4.5 2.5 -5.5" align="center" color="#333" rotation="0 90 0"></a-text>
      <a-box mixin="ext-wall" position="-7.65 1.5 -5.5" width="0.3" height="3" depth="7"></a-box>
      <a-box mixin="wall" position="-1.5 1.5 -8" width="0.3" height="3" depth="2"></a-box> 
      <a-box mixin="wall" position="-1.5 2.5 -5.5" width="0.3" height="1" depth="3"></a-box> 
      <a-box mixin="wall" position="-1.5 1.5 -3" width="0.3" height="3" depth="2"></a-box> 
      <!-- Kitchen/Dining Divider -->
      <a-box mixin="wall" position="-6.5 1.5 -2" width="2" height="3"></a-box>
      <a-box mixin="wall" position="-4.5 2.5 -2" width="2" height="1"></a-box>
      <a-box mixin="wall" position="-2.5 1.5 -2" width="2" height="3"></a-box>
      <a-box position="-6.5 1 -5.5" width="1.5" height="2" depth="4" color="#AAA"></a-box>

      <!-- 4. DINING ROOM (-2 to +6) -->
      <a-text value="Dining Room" position="-4.5 2.5 2" align="center" color="#333"></a-text>
      <a-box mixin="ext-wall" position="-7.65 1.5 2" width="0.3" height="3" depth="8"></a-box>
      
      <!-- SOUTH WALL (Spanning West and Hallway) -->
      <!-- Window Wall Left -->
      <a-box mixin="ext-wall" position="-7 1.5 6.15" width="1.6" height="3" depth="0.3"></a-box>
      <!-- Large Window span -->
      <a-box mixin="ext-wall" position="-1.5 2.75 6.15" width="10" height="0.5" depth="0.3"></a-box> <!-- Top -->
      <a-box mixin="ext-wall" position="-1.5 0.5 6.15" width="10" height="1" depth="0.3"></a-box> <!-- Bottom -->
      <a-box mixin="window-glass" position="-1.5 1.625 6.15" width="9.5" height="1.75" depth="0.1"></a-box>
      
      <a-cylinder position="-4.5 0.8 2" radius="1.2" height="0.1" color="#5C4033"></a-cylinder>
      <a-cylinder position="-4.5 0.4 2" radius="0.2" height="0.8" color="#333"></a-cylinder>

      <!-- === EAST SIDE STRUCTURE (Right) === -->

      <!-- 1. BEDROOM 1 -->
      <a-text value="Bedroom 1" position="4.5 2.5 -10.5" align="center" color="#333" rotation="0 -90 0"></a-text>
      <a-box mixin="ext-wall" position="4.6 1.5 -14.15" width="6.3" height="3"></a-box>
      <a-box mixin="wall" position="1.5 1.5 -13" width="0.3" height="3" depth="2"></a-box>
      <a-box mixin="wall" position="1.5 2.5 -11" width="0.3" height="1" depth="2"></a-box>
      <!-- FIX: Extended Hallway wall to close the gap into the SW corner of Bed 1 -->
      <a-box mixin="wall" position="1.5 1.5 -8.5" width="0.3" height="3" depth="3"></a-box>
      
      <a-box mixin="wall" position="3.25 1.5 -7" width="3.5" height="3"></a-box> 
      <a-box mixin="wall" position="6.5 2.5 -7" width="3" height="1"></a-box>
      <a-box mixin="ext-wall" position="7.65 0.5 -10.5" width="0.3" height="1" depth="7.3"></a-box>
      <a-box mixin="ext-wall" position="7.65 2.75 -10.5" width="0.3" height="0.5" depth="7.3"></a-box>
      <a-box mixin="window-glass" position="7.65 1.625 -10.5" width="0.1" height="1.75" depth="6"></a-box>
      <a-box position="6 0.5 -11" width="2.5" height="0.6" depth="3" color="blue"></a-box>

      <!-- 2. ENSUITE -->
      <a-text value="Ensuite" position="4.5 2.5 -5.5" align="center" color="#333" rotation="0 -90 0"></a-text>
      <a-box mixin="wall" position="1.5 1.5 -5.5" width="0.3" height="3" depth="3"></a-box>
      <a-box mixin="wall" position="4.5 1.5 -4" width="6" height="3"></a-box>
      <a-box mixin="ext-wall" position="7.65 0.5 -5.5" width="0.3" height="1" depth="3"></a-box>
      <a-box mixin="ext-wall" position="7.65 2.75 -5.5" width="0.3" height="0.5" depth="3"></a-box>
      <a-box mixin="window-glass" position="7.65 1.625 -5.5" width="0.1" height="1.75" depth="2.8"></a-box>
      <a-cylinder position="6 0.4 -5.5" radius="0.3" height="0.6" color="white"></a-cylinder>

      <!-- 3. BEDROOM 2 -->
      <a-text value="Bedroom 2" position="4.5 2.5 -1.5" align="center" color="#333" rotation="0 -90 0"></a-text>
      <a-box mixin="wall" position="1.5 1.5 -3" width="0.3" height="3" depth="2"></a-box>
      <a-box mixin="wall" position="1.5 2.5 -1.5" width="0.3" height="1" depth="1"></a-box>
      <a-box mixin="wall" position="1.5 1.5 0" width="0.3" height="3" depth="2"></a-box>
      <a-box mixin="wall" position="4.5 1.5 1" width="6" height="3"></a-box>
      <a-box mixin="ext-wall" position="7.65 0.5 -1.5" width="0.3" height="1" depth="5"></a-box>
      <a-box mixin="ext-wall" position="7.65 2.75 -1.5" width="0.3" height="0.5" depth="5"></a-box>
      <a-box mixin="window-glass" position="7.65 1.625 -1.5" width="0.1" height="1.75" depth="4"></a-box>
      <a-box position="6 0.5 -1.5" width="2.5" height="0.6" depth="3" color="green"></a-box>

      <!-- 4. LIVING ROOM -->
      <a-text value="Living Room" position="4.5 2.5 4.5" align="center" color="#333" rotation="0 -90 0"></a-text>
      <a-box mixin="wall" position="1.5 1.5 1.5" width="0.3" height="3" depth="1"></a-box>
      <a-box mixin="wall" position="1.5 2.5 3.5" width="0.3" height="1" depth="3"></a-box> <!-- Arch Header -->
      <a-box mixin="wall" position="1.5 1.5 5.5" width="0.3" height="3" depth="1"></a-box>
      <a-box mixin="ext-wall" position="7.65 0.5 4.5" width="0.3" height="1" depth="7"></a-box>
      <a-box mixin="ext-wall" position="7.65 2.75 4.5" width="0.3" height="0.5" depth="7"></a-box>
      <a-box mixin="window-glass" position="7.65 1.625 4.5" width="0.1" height="1.75" depth="6"></a-box>
      
      <!-- South Wall (Living Side) -->
      <a-box mixin="ext-wall" position="4.5 2.75 6.15" width="6" height="0.5" depth="0.3"></a-box>
      <a-box mixin="ext-wall" position="4.5 0.5 6.15" width="6" height="1" depth="0.3"></a-box>
      <a-box mixin="window-glass" position="4.5 1.625 6.15" width="5.8" height="1.75" depth="0.1"></a-box>
      <a-box mixin="ext-wall" position="7.65 1.5 6.15" width="0.3" height="3" depth="0.3"></a-box>

      <!-- FIREPLACE (NE Corner of Living Room, 45 deg) -->
      <a-box position="7.0 1.5 1.6" rotation="0 -45 0" width="1.5" height="3" depth="0.5" color="#555"></a-box> <!-- Chimney -->
      <a-box position="6.9 0.5 1.7" rotation="0 -45 0" width="0.8" height="0.6" depth="0.6" color="#222"></a-box> <!-- Hearth -->

      <a-box position="6.5 0.6 4.5" width="1.5" height="0.8" depth="3" color="#364958"></a-box>

      <!-- === CAMERA RIG === -->
      <!-- Removed 'constrainToNavMesh: true' so you can walk through walls.
           By default, movement-controls keeps you on the X/Z plane (floor), so you won't fly. -->
      <a-entity id="rig" 
                movement-controls="speed: 0.25; constrainToNavMesh: false" 
                position="0 0 -16"
                rotation="0 180 0">
        <a-entity camera 
                  look-controls 
                  position="0 1.6 0">
          <a-cursor color="black" scale="0.5 0.5 0.5"></a-cursor>
        </a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
