<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Turbo - 16-Bit Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
        }
        body {
            margin: 0;
            padding: 0;
            background: #050505;
            font-family: 'Press Start 2P', cursive;
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            image-rendering: pixelated;
        }
        
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            transition: background 0.5s;
        }

        #overlay.victory-mode {
            background: rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 4vw; 
            margin-bottom: 20px;
            color: var(--neon-blue);
            text-shadow: 4px 4px 0px var(--neon-pink);
        }

        .btn {
            background: var(--neon-pink);
            color: #fff;
            border: 4px solid #fff;
            padding: 15px 30px;
            font-size: 1.5vw;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 4px 4px 0px #800080;
        }

        .btn:hover { background: #ff40ff; }
        .hidden { display: none !important; }
        
        .msg-box {
            background: #000;
            border: 4px solid white;
            padding: 2vw;
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 1.2vw;
        }

        .victory-mode .msg-box {
            background: rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="300"></canvas>

        <div id="overlay">
            <h1 id="overlay-title">TESLA TURBO</h1>
            <div class="msg-box" id="msg-content">
                <p>LAP 1: &lt; 75 SECONDS</p>
                <p>LAP 2: &lt; 70 SECONDS</p>
                <p style="font-size: 0.8em; color: #aaa; margin-top: 10px;">
                    LOW GEAR: 0-80 MPH (WATCH HEAT)<br>
                    HIGH GEAR: 50+ MPH (SLOW START)
                </p>
            </div>
            <button class="btn" id="start-btn">INSERT COIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const msgContent = document.getElementById('msg-content');
        const startBtn = document.getElementById('start-btn');

        const width = 400;
        const height = 300;

        const roadWidth = 2000;
        const segmentLength = 200;
        const lanes = 3;
        const cameraHeight = 1000;
        const drawDistance = 200;
        const fieldOfView = 100;
        const cameraDepth = 1 / Math.tan((fieldOfView / 2) * Math.PI / 180);

        // Physics Constants
        const SPEED_LOW_CAP = 8000;   
        const SPEED_HIGH_CAP = 12000; 
        const SPEED_HIGH_THRESHOLD = 5000; 
        
        const ACCEL_LOW = 6000;       
        const ACCEL_HIGH_SLOW = 800;  
        const ACCEL_HIGH_FAST = 5000; 
        
        const breaking = -15000;
        const decel = -2000;
        const downshiftDecel = -1500; // Slower deceleration for smoother downshifts
        const offRoadDecel = -12000; 
        const offRoadLimit = 4000;    

        let player = { x: 0, z: 0, speed: 0, gear: 'LOW', score: 0, maxSpeed: 8000 };
        let keys = {};
        let segments = [];
        let cars = [];
        let trackMap = []; 
        let mapBounds = { minX: 0, maxX: 0, minY: 0, maxY: 0 };
        let trackLength = 0;
        let paused = true;
        let lastTime = performance.now();
        let worldHeading = 0; 

        let lowGearTimer = 0;
        let penaltyTimer = 0;
        let penaltyLabel = ""; 

        let raceState = 'MENU'; 
        let raceStartTime = 0;
        let countdownStep = 0;
        let victoryPhase = 0; 
        let crowdSprites = [];
        let currentLap = 1;
        let lapStartTime = 0;
        const LAP1_LIMIT = 75; 
        const LAP2_LIMIT = 70; 
        let totalLaps = 2;

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyX","KeyZ"].includes(e.code)) e.preventDefault();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function project(p, cameraX, cameraY, cameraZ) {
            p.camera.x = (p.world.x || 0) - cameraX;
            p.camera.y = (p.world.y || 0) - cameraY;
            p.camera.z = (p.world.z || 0) - cameraZ;
            const screenZ = Math.max(p.camera.z, 1);
            p.screen.scale = cameraDepth / screenZ;
            const rawX = (width / 2) + (p.screen.scale * p.camera.x * width / 2);
            const rawY = (height / 2) - (p.screen.scale * p.camera.y * height / 2);
            const rawW = (p.screen.scale * roadWidth * width / 2);
            p.screen.x = Math.round(Math.max(-5000, Math.min(5000, rawX)));
            p.screen.y = Math.round(Math.max(-5000, Math.min(5000, rawY)));
            p.screen.w = Math.round(Math.max(0, Math.min(5000, rawW)));
        }

        const findSegment = (z) => {
            const index = Math.floor(z / segmentLength) % segments.length;
            // Handle negative index wrap-around correctly
            return segments[(index + segments.length) % segments.length];
        };

        function addSegment(curve, y) {
            let n = segments.length;
            segments.push({
                index: n,
                p1: { world: { y: lastY(), z: n * segmentLength }, camera: {}, screen: {} },
                p2: { world: { y: y, z: (n + 1) * segmentLength }, camera: {}, screen: {} },
                curve: curve,
                cars: [],
                sprites: [],
                color: Math.floor(n / 3) % 2 ? 
                    { road: '#444', grass: '#109110', rumble: '#fff', lane: '#fff' } : 
                    { road: '#333', grass: '#007000', rumble: '#f00', lane: '#333' }
            });
        }

        const lastY = () => segments.length > 0 ? segments[segments.length - 1].p2.world.y : 0;

        function addRoad(enter, hold, leave, curve, y) {
            let startY = lastY();
            let endY = startY + (y * segmentLength);
            let total = enter + hold + leave;
            for (let n = 0; n < enter; n++) addSegment(curve * (n/enter), startY + (endY-startY)*(n/total));
            for (let n = 0; n < hold; n++) addSegment(curve, startY + (endY-startY)*((enter+n)/total));
            for (let n = 0; n < leave; n++) addSegment(curve * (1-(n/leave)), startY + (endY-startY)*((enter+hold+n)/total));
        }

        function generateTrackMap() {
            trackMap = [];
            let x = 0, y = 0, angle = 0;
            let minX = 0, maxX = 0, minY = 0, maxY = 0;

            // Optimization: sample every 20th
            for(let i=0; i<segments.length; i+=20) {
                let seg = segments[i];
                for(let k=0; k<20; k++) {
                    if (segments[i+k]) angle += segments[i+k].curve * 0.007;
                }
                x += Math.sin(angle) * 5; 
                y -= Math.cos(angle) * 5;
                trackMap.push({x: x, y: y, segIndex: i});
                if(x < minX) minX = x;
                if(x > maxX) maxX = x;
                if(y < minY) minY = y;
                if(y > maxY) maxY = y;
            }
            
            // Loop Closure Correction
            if (trackMap.length > 0) {
                let lastP = trackMap[trackMap.length - 1];
                let startX = 0, startY = 0;
                let gapX = startX - lastP.x;
                let gapY = startY - lastP.y;

                trackMap.forEach((pt, i) => {
                    let progress = i / (trackMap.length - 1);
                    pt.x += gapX * progress;
                    pt.y += gapY * progress;
                    
                    if(pt.x < minX) minX = pt.x;
                    if(pt.x > maxX) maxX = pt.x;
                    if(pt.y < minY) minY = pt.y;
                    if(pt.y > maxY) maxY = pt.y;
                });
            }
            
            mapBounds = { minX, maxX, minY, maxY };
        }

        function resetTrack() {
            segments = [];
            // TOP GEAR TEST TRACK LAYOUT
            addRoad(100, 100, 100, 0, 0);       
            addRoad(80, 80, 80, 2, 0);          
            addRoad(50, 80, 50, -4, 0);         
            addRoad(80, 100, 80, 5, 0);         
            addRoad(100, 100, 100, 0, 0);       
            addRoad(40, 40, 40, -6, 0);         
            addRoad(40, 40, 40, 6, 0);          
            addRoad(100, 100, 100, 0, 0);       
            addRoad(100, 100, 100, 2.5, 0);     
            addRoad(80, 80, 80, -2, 0);         
            addRoad(50, 50, 50, -4, 0);         
            addRoad(50, 50, 50, 0, 0);          
            addRoad(30, 30, 30, -6, 0);         
            addRoad(120, 120, 120, 0, 0);       
            
            trackLength = segments.length * segmentLength;
            for (let n = 0; n < 3; n++) segments[n].color.road = '#fff';

            segments.forEach((seg, i) => {
                if (i > 20 && i < segments.length - 50 && Math.random() < 0.025) {
                    seg.sprites.push({ type: 'SIGN', offset: Math.random() > 0.5 ? 1.3 : -1.3 });
                }
            });

            resetCars();
            generateTrackMap();
        }

        function addFinishLineDetails() {
            let finishIndex = segments.length - 15;
            for (let n = 0; n < 15; n++) {
                let seg = segments[(finishIndex + n) % segments.length];
                seg.sprites.push({ type: 'PERSON', offset: -1.5 - (Math.random() * 0.5) });
                seg.sprites.push({ type: 'PERSON', offset: 1.5 + (Math.random() * 0.5) });
            }
        }

        function resetCars() {
            cars = [];
            for (let n = 0; n < 30; n++) {
                let offset = Math.random() * 0.8 * (Math.random() > 0.5 ? 1 : -1);
                let z = Math.floor(Math.random() * (segments.length - 100) + 50) * segmentLength;
                let isFast = Math.random() < 0.2; 
                let carMaxSpeed = isFast ? (13000 + Math.random() * 9000) : (5000 + Math.random() * 5000);
                let car = { 
                    offset, 
                    z, 
                    speed: carMaxSpeed * 0.8, 
                    maxSpeed: carMaxSpeed,
                    baseSpeed: carMaxSpeed 
                };
                findSegment(z).cars.push(car);
                cars.push(car);
            }
        }

        function drawPolygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
            ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
            ctx.closePath();
            ctx.fill();
        }

        function drawSegment(segment) {
            let p1 = segment.p1;
            let p2 = segment.p2;

            ctx.fillStyle = segment.color.grass;
            ctx.fillRect(0, p2.screen.y, width, p1.screen.y - p2.screen.y);

            let r1 = p1.screen.w / 10;
            let r2 = p2.screen.w / 10;
            drawPolygon(p1.screen.x - p1.screen.w - r1, p1.screen.y, p1.screen.x - p1.screen.w, p1.screen.y, p2.screen.x - p2.screen.w, p2.screen.y, p2.screen.x - p2.screen.w - r2, p2.screen.y, segment.color.rumble);
            drawPolygon(p1.screen.x + p1.screen.w + r1, p1.screen.y, p1.screen.x + p1.screen.w, p1.screen.y, p2.screen.x + p2.screen.w, p2.screen.y, p2.screen.x + p2.screen.w + r2, p2.screen.y, segment.color.rumble);

            let roadColor = segment.color.road;
            if (segment.index < 3) roadColor = '#fff'; 
            else if (segment.index > segments.length - 6) {
                let check = Math.floor((segment.index + (Date.now()/100)) % 2) === 0;
                roadColor = check ? '#fff' : '#000';
            }

            drawPolygon(p1.screen.x - p1.screen.w, p1.screen.y, p1.screen.x + p1.screen.w, p1.screen.y, p2.screen.x + p2.screen.w, p2.screen.y, p2.screen.x - p2.screen.w, p2.screen.y, roadColor);

            if (segment.color.lane && segment.index % 4 === 0 && segment.index > 5 && segment.index < segments.length - 10) {
                let l1 = p1.screen.w / 30;
                let l2 = p2.screen.w / 30;
                let lanew = p1.screen.w * 2 / lanes;
                let lx1 = p1.screen.x - p1.screen.w + lanew;
                let lx2 = p2.screen.x - p2.screen.w + lanew;
                for (let i = 1; i < lanes; lx1 += lanew, lx2 += lanew, i++) {
                    drawPolygon(lx1 - l1, p1.screen.y, lx1 + l1, p1.screen.y, lx2 + l2, p2.screen.y, lx2 - l2, p2.screen.y, segment.color.lane);
                }
            }
        }

        function drawSign(x, y, scale) {
            if (scale <= 0) return;
            let w = 40 * scale;
            let h = 80 * scale;
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = '#8b4513'; ctx.fillRect(-w/8, -h, w/4, h);
            ctx.fillStyle = '#ff0000'; ctx.fillRect(-w/2, -h, w, w); 
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * (scale * 5); ctx.strokeRect(-w/2, -h, w, w);
            ctx.restore();
        }

        function drawPerson(x, y, scale, hasFlag) {
            if (scale <= 0) return;
            let w = 15 * scale;
            let h = 30 * scale;
            let jump = (Date.now() % 500) > 250 ? 5 * scale : 0; 

            ctx.save();
            ctx.translate(x, y - jump);
            ctx.fillStyle = '#ffccaa'; 
            ctx.fillRect(-w/2, -h, w, w); 
            ctx.fillStyle = Math.random() > 0.5 ? '#00f' : '#0f0'; 
            ctx.fillRect(-w/2, -h + w, w, h*0.6);
            ctx.fillStyle = '#222';
            ctx.fillRect(-w/2, -h*0.4 + w, w/2.2, h*0.4); 
            ctx.fillRect(0, -h*0.4 + w, w/2.2, h*0.4);
            
            if (hasFlag) {
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * scale;
                ctx.beginPath(); ctx.moveTo(w/2, -h*0.5); ctx.lineTo(w, -h*2); ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.fillRect(w, -h*2, w*2, h*0.5);
            }
            ctx.restore();
        }

        function drawTesla(x, y, scale, color, isPlayer = false) {
            if (scale <= 0) return;
            let w = 80 * scale;
            let h = 40 * scale;
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(-w/2, 0); ctx.lineTo(-w/2, -h*0.4);
            ctx.lineTo(-w*0.3, -h); ctx.lineTo(w*0.3, -h);
            ctx.lineTo(w/2, -h*0.4); ctx.lineTo(w/2, 0);
            ctx.fill();
            ctx.fillStyle = 'rgba(17, 17, 17, 0.4)'; 
            ctx.fillRect(-w*0.2, -h*0.8, w*0.4, h*0.4);
            ctx.fillStyle = isPlayer ? '#f00' : '#300';
            ctx.fillRect(-w*0.45, -h*0.35, w*0.15, h*0.15);
            ctx.fillRect(w*0.3, -h*0.35, w*0.15, h*0.15);
            ctx.restore();
        }

        function drawStartLights() {
            // Draw lights if we are in countdown OR first 1.5s of race
            if (currentLap === 1 && (raceState === 'COUNTDOWN' || (raceState === 'RACING' && performance.now() - lapStartTime < 1500))) {
                let y = height / 3;
                let startX = width / 2 - 60;
                
                // Draw Housing
                ctx.fillStyle = '#000'; 
                ctx.fillRect(startX - 50, y - 40, 220, 80);
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 4;
                ctx.strokeRect(startX - 50, y - 40, 220, 80);

                for (let i = 0; i < 3; i++) {
                    let lx = startX + (i * 60);
                    let color = '#330000'; // Dim Red
                    
                    if (countdownStep < 4) { 
                        if (i < countdownStep) color = '#ff0000'; 
                    } else { 
                        color = '#00ff00'; 
                    } 
                    
                    ctx.fillStyle = color; 
                    ctx.beginPath(); 
                    ctx.arc(lx, y, 20, 0, Math.PI * 2); 
                    ctx.fill();
                    
                    if ((countdownStep < 4 && i < countdownStep) || countdownStep === 4) {
                        ctx.fillStyle = 'rgba(255,255,255,0.5)';
                        ctx.beginPath(); ctx.arc(lx - 5, y - 5, 5, 0, Math.PI * 2); ctx.fill();
                    }
                }
            }
        }

        function drawDashboard(remainingTime) {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, height - 40, width, 40);
            ctx.fillStyle = '#333';
            ctx.fillRect(0, height - 40, width, 2);

            let frameW = 120;
            let frameH = 36;
            let frameX = (width / 2) - (frameW / 2); 
            let frameY = height - 38;
            
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 2;
            ctx.strokeRect(frameX, frameY, frameW, frameH);
            ctx.fillStyle = '#000';
            ctx.fillRect(frameX, frameY, frameW, frameH);

            let mapDispW = frameW - 4;
            let mapDispH = frameH - 4;
            let mapW = Math.max(1, mapBounds.maxX - mapBounds.minX); 
            let mapH = Math.max(1, mapBounds.maxY - mapBounds.minY);
            
            let scaleX = mapDispW / mapW;
            let scaleY = mapDispH / mapH;
            let mapScale = Math.min(scaleX, scaleY);
            
            let mapCenterX = frameX + frameW/2;
            let mapCenterY = frameY + frameH/2;
            
            let offsetX = mapCenterX - (mapBounds.minX + mapW/2) * mapScale;
            let offsetY = mapCenterY - (mapBounds.minY + mapH/2) * mapScale;

            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            trackMap.forEach((pt, i) => {
                let px = offsetX + pt.x * mapScale;
                let py = offsetY + pt.y * mapScale;
                if (i===0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            });
            if (trackMap.length > 0) {
                let px = offsetX + trackMap[0].x * mapScale;
                let py = offsetY + trackMap[0].y * mapScale;
                ctx.lineTo(px, py);
            }
            ctx.stroke();

            let playerSegIdx = findSegment(player.z).index;
            let mapIndex = Math.floor(playerSegIdx / 20);
            if (mapIndex >= trackMap.length) mapIndex = 0;
            
            let pMap = trackMap[mapIndex];
            if (pMap) {
                ctx.fillStyle = '#fff';
                ctx.beginPath(); 
                ctx.arc(offsetX + pMap.x*mapScale, offsetY + pMap.y*mapScale, 2, 0, Math.PI*2); 
                ctx.fill();
            }

            ctx.fillStyle = '#f00';
            cars.forEach(car => {
                let carSegIdx = findSegment(car.z).index;
                let cMapIndex = Math.floor(carSegIdx / 20);
                if (cMapIndex >= trackMap.length) cMapIndex = 0;
                let cMap = trackMap[cMapIndex];
                if (cMap) {
                    ctx.beginPath();
                    ctx.arc(offsetX + cMap.x*mapScale, offsetY + cMap.y*mapScale, 1.5, 0, Math.PI*2);
                    ctx.fill();
                }
            });

            ctx.textAlign = 'center';
            ctx.font = '10px "Press Start 2P"';
            
            let leftCenter = frameX / 2;
            ctx.fillStyle = '#00f2ff';
            ctx.fillText(Math.round(player.speed/100) + " MPH", leftCenter, height - 22);
            ctx.fillStyle = player.gear === 'HIGH' ? '#ff00ff' : '#aaa';
            ctx.fillText(player.gear, leftCenter, height - 8);

            let rightStart = frameX + frameW;
            let rightCenter = rightStart + (width - rightStart) / 2;
            
            ctx.fillStyle = '#ffcc00';
            ctx.fillText("LAP " + currentLap + "/" + totalLaps, rightCenter, height - 22);
            let timeStr = remainingTime > 0 ? remainingTime.toFixed(1) : "0.0";
            ctx.fillStyle = remainingTime < 10 ? '#f00' : '#fff';
            ctx.fillText(timeStr, rightCenter, height - 8);

            ctx.fillStyle = '#fff';
            ctx.textAlign = 'right';
            ctx.font = '8px "Press Start 2P"';
            ctx.fillText("SCORE:" + player.score, width - 5, height - 45);
        }

        function drawRearMirror() {
            let mx = width / 2 - 50;
            let my = 10;
            let mw = 100;
            let mh = 30;

            ctx.fillStyle = '#222';
            ctx.fillRect(mx - 2, my - 2, mw + 4, mh + 4);
            
            ctx.save();
            ctx.beginPath(); ctx.rect(mx, my, mw, mh); ctx.clip();

            let grad = ctx.createLinearGradient(mx, my, mx, my + mh/2);
            grad.addColorStop(0, '#4b0082'); 
            grad.addColorStop(1, '#ff4500'); 
            ctx.fillStyle = grad;
            ctx.fillRect(mx, my, mw, mh/2);
            
            ctx.fillStyle = '#555'; ctx.fillRect(mx, my + mh/2, mw, mh/2); 

            let baseSeg = findSegment(player.z);
            let pIndex = baseSeg.index;
            
            for (let n = 1; n < 60; n++) { 
                let idx = (pIndex - n + segments.length) % segments.length;
                let seg = segments[idx];
                
                seg.cars.forEach(car => {
                    let dist = n * segmentLength + (player.z % segmentLength) - (car.z % segmentLength);
                    if (dist < 50) dist = 50; 
                    
                    let scale = 150 / dist; 
                    let carW = 20 * scale;
                    let carH = 10 * scale;
                    
                    let carX = mx + mw/2 - (car.offset * mw * 0.3 * scale);
                    let carY = my + mh/2 + (5 * scale);
                    
                    if (carY < my + mh/2) carY = my + mh/2;

                    ctx.fillStyle = '#111'; 
                    ctx.fillRect(carX - carW/2, carY - carH, carW, carH);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(carX - carW*0.4, carY - carH*0.5, carW*0.2, carH*0.2);
                    ctx.fillRect(carX + carW*0.2, carY - carH*0.5, carW*0.2, carH*0.2);
                });
            }
            ctx.restore();
        }

        function drawSky() {
            let grad = ctx.createLinearGradient(0, 0, 0, height/2);
            grad.addColorStop(0, '#001a33'); grad.addColorStop(1, '#ff6600');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, width, height/2);
            
            let sunX = (width * 0.2) - (worldHeading * 300); 
            
            sunX = sunX % (width * 4); 
            if (sunX < -width) sunX += width * 4;
            
            ctx.fillStyle = '#ffcc00'; 
            ctx.beginPath(); ctx.arc(sunX, height * 0.25, 25, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#1a0033';
            for(let i = -1; i < 3; i++) {
                let sX = (i * width) - (worldHeading * 200) % width;
                if (sX < -width) sX += width;
                
                ctx.beginPath(); 
                ctx.moveTo(sX, height/2); 
                ctx.lineTo(sX + width*0.3, height/2-40); 
                ctx.lineTo(sX + width*0.6, height/2); 
                ctx.fill();
            }
        }

        function update(dt) {
            if (paused) return;

            // Handle Penalty Timer
            if (penaltyTimer > 0) {
                penaltyTimer -= dt;
                player.speed = 0; // Lock speed
                if (penaltyTimer <= 0) {
                    penaltyTimer = 0;
                    penaltyLabel = "";
                }
                return; 
            }

            if (raceState === 'FINISHED') {
                player.speed += decel * dt * 2; 
                if (player.speed <= 0) {
                    player.speed = 0;
                    if (victoryPhase === 0) {
                        victoryPhase = 1; 
                        overlay.classList.remove('hidden');
                        overlay.classList.add('victory-mode');
                        overlayTitle.innerText = "VICTORY!";
                        startBtn.innerText = "PLAY AGAIN";
                        msgContent.innerHTML = "<p>GREAT DRIVING!</p><p>SCORE: " + player.score + "</p>";

                        crowdSprites = [];
                        for(let i=0; i<15; i++) {
                            let side = Math.random() > 0.5;
                            let cx = side ? (Math.random() * 100) : (300 + Math.random() * 100);
                            crowdSprites.push({
                                x: cx,
                                y: height - 10 + (Math.random()*40),
                                scale: 2 + Math.random(),
                                hasFlag: Math.random() > 0.6
                            });
                        }
                    }
                }
            }
            else if (raceState === 'COUNTDOWN') {
                let elapsed = (performance.now() - raceStartTime) / 1000;
                // Immediate Red (Step 1)
                if (elapsed < 1) countdownStep = 1;
                else if (elapsed < 2) countdownStep = 2;
                else if (elapsed < 3) countdownStep = 3;
                else {
                    countdownStep = 4;
                    raceState = 'RACING';
                    lapStartTime = performance.now(); 
                }
                player.speed = 0;
            }
            else if (raceState === 'RACING') {
                let elapsed = (performance.now() - lapStartTime) / 1000;
                let limit = currentLap === 1 ? LAP1_LIMIT : LAP2_LIMIT;
                let remaining = Math.max(0, limit - elapsed);
                
                if (remaining <= 0) {
                    raceState = 'GAMEOVER';
                    overlay.classList.remove('hidden');
                    overlay.classList.remove('victory-mode');
                    overlayTitle.innerText = "TOO SLOW";
                    msgContent.innerHTML = "<p>YOU RAN OUT OF TIME</p>";
                    startBtn.innerText = "TRY AGAIN";
                    return;
                }
                
                // --- ACCELERATION & GEAR LOGIC ---
                if (keys['KeyX']) {
                    if (player.gear === 'LOW') {
                        // Overheat only accumulates if at top speed (with small buffer)
                        if (player.speed >= SPEED_LOW_CAP - 100) {
                            lowGearTimer += dt;
                        } else {
                            // Cool down if accelerating but not at top speed yet
                            lowGearTimer = Math.max(0, lowGearTimer - dt);
                        }

                        if (lowGearTimer > 8) {
                            penaltyTimer = 2; 
                            penaltyLabel = "COOLING";
                            lowGearTimer = 0;
                            player.speed = 0;
                        } else {
                            if (player.speed < SPEED_LOW_CAP) {
                                // Dynamic Low Gear Accel Curve
                                let pct = player.speed / SPEED_LOW_CAP;
                                let curveAccel = 800 + 1700 * Math.sin(Math.PI * pct);
                                player.speed += curveAccel * dt;
                            } else {
                                player.speed += downshiftDecel * dt;
                            }
                        }
                    } else {
                        // High Gear
                        lowGearTimer = Math.max(0, lowGearTimer - dt * 2); // Cool down rapidly
                        
                        // Modified High Gear: No stall, just very slow start
                        if (player.speed < SPEED_HIGH_THRESHOLD) {
                            let ramp = player.speed / SPEED_HIGH_THRESHOLD;
                            let curveAccel = 200 + 800 * ramp;
                            player.speed += curveAccel * dt;
                        } else {
                            let range = SPEED_HIGH_CAP - SPEED_HIGH_THRESHOLD;
                            let pct = (player.speed - SPEED_HIGH_THRESHOLD) / range;
                            let curveAccel = 1500 + 1500 * Math.sin(Math.PI * pct);
                            if (player.speed >= SPEED_HIGH_CAP - 500) curveAccel *= 0.5; 
                            
                            player.speed += curveAccel * dt;
                        }
                    }
                } else if (keys['KeyZ']) {
                    player.speed += breaking * dt;
                    lowGearTimer = Math.max(0, lowGearTimer - dt * 2); 
                } else {
                    player.speed += decel * dt;
                    lowGearTimer = Math.max(0, lowGearTimer - dt * 2);
                }
            }

            // Cap absolute physics limits
            player.speed = Math.min(player.speed, SPEED_HIGH_CAP);
            player.speed = Math.max(player.speed, 0);

            // --- GEAR UPDATES MAX SPEED FOR CLAMPING ---
            // This ensures logic uses current gear caps for final clamp
            if (player.gear === 'LOW') player.maxSpeed = SPEED_LOW_CAP;
            else player.maxSpeed = SPEED_HIGH_CAP;

            let playerSegment = findSegment(player.z);
            // Use SPEED_HIGH_CAP for physics ratio to keep handling consistent at speed
            let speedRatio = player.speed / SPEED_HIGH_CAP;
            
            worldHeading += playerSegment.curve * (player.speed/20000) * dt;

            // Centrifugal Force
            // Pushes car outward based on speed squared
            let centrifugalForce = (speedRatio * speedRatio) * playerSegment.curve * 4.0 * dt; // Define it here!
            // Reduce force in low gear to allow cornering
            if (player.gear === 'LOW') centrifugalForce *= 0.2; 

            player.x -= centrifugalForce;

            // Steer (Reduced sensitivity to stop twitchiness)
            let steerSaturation = 6000;
            let steerFactor = Math.min(1.0, player.speed / steerSaturation);
            
            let baseSteer = 1.1; // Reduced from 1.8
            if (player.gear === 'LOW') baseSteer = 2.0; // Reduced from 3.0

            let steerInput = dt * baseSteer * steerFactor;

            if (raceState !== 'FINISHED') {
                if (keys['ArrowLeft']) player.x -= steerInput; 
                if (keys['ArrowRight']) player.x += steerInput; 
                if (keys['ArrowUp']) player.gear = 'HIGH'; 
                if (keys['ArrowDown']) player.gear = 'LOW'; 
            }

            if ((player.x < -1 || player.x > 1) && player.speed > offRoadLimit) {
                 player.speed += offRoadDecel * dt;
            }

            player.z += player.speed * dt;
            
            if (player.z >= trackLength) {
                player.z -= trackLength;
                if (raceState === 'RACING') {
                    if (currentLap < totalLaps) {
                        currentLap++;
                        lapStartTime = performance.now(); 
                    } else {
                        raceState = 'FINISHED'; 
                    }
                }
            }
            
            player.x = Math.min(Math.max(player.x, -3), 3);

            if (playerSegment.sprites && raceState === 'RACING') {
                playerSegment.sprites.forEach(sprite => {
                    if (!sprite.hit && Math.abs(player.x - sprite.offset) < 0.3) {
                        player.speed *= 0.5; // Reduced penalty (was 0)
                        sprite.hit = true;   // Mark as hit so we don't collide again this lap
                    } 
                });
            }

            cars.forEach(car => {
                if (raceState !== 'RACING') return; 

                let oldS = findSegment(car.z);
                let curveSeverity = Math.abs(oldS.curve);
                let targetSpeed = car.baseSpeed;
                
                if (curveSeverity > 0) {
                    targetSpeed = car.baseSpeed / (1 + curveSeverity * 4);
                }

                if (car.speed > targetSpeed) car.speed -= 2000 * dt;
                else if (car.speed < targetSpeed) car.speed += 1000 * dt;

                car.z += car.speed * dt;
                
                if (car.z > trackLength) car.z -= trackLength;
                let newS = findSegment(car.z);
                if (oldS !== newS) {
                    oldS.cars.splice(oldS.cars.indexOf(car), 1);
                    newS.cars.push(car);
                }
            });

            if (raceState === 'RACING') player.score += Math.round(player.speed / 2500);
        }

        function draw() {
            // Guard against rendering if segments are not ready
            if (!segments.length) return;

            ctx.clearRect(0, 0, width, height);

            drawSky();

            ctx.fillStyle = '#007000'; ctx.fillRect(0, height/2, width, height/2);

            let baseSegment = findSegment(player.z);
            let basePercent = (player.z % segmentLength) / segmentLength;
            let playerY = baseSegment.p1.world.y + (baseSegment.p2.world.y - baseSegment.p1.world.y) * basePercent;
            let x = 0, dx = - (baseSegment.curve * basePercent);
            let cameraZOffset = 150; 

            for (let n = 0; n < drawDistance; n++) {
                let segment = segments[(baseSegment.index + n) % segments.length];
                segment.looped = segment.index < baseSegment.index;
                project(segment.p1, player.x * roadWidth - x, playerY + cameraHeight, player.z - (segment.looped ? trackLength : 0) - cameraZOffset);
                project(segment.p2, player.x * roadWidth - x - dx, playerY + cameraHeight, player.z - (segment.looped ? trackLength : 0) - cameraZOffset);
                x += dx; dx += segment.curve;
            }

            for (let n = drawDistance - 1; n >= 0; n--) {
                let segment = segments[(baseSegment.index + n) % segments.length];
                if (segment.p2.screen.y >= segment.p1.screen.y) continue;
                drawSegment(segment);
            }

            for (let n = drawDistance - 1; n > 0; n--) {
                let segment = segments[(baseSegment.index + n) % segments.length];
                let scale = segment.p1.screen.scale;
                let cY = segment.p1.screen.y;

                if (cY > height/2 && cY < height && scale > 0) {
                    segment.cars.forEach(car => {
                        let cX = segment.p1.screen.x + (scale * car.offset * roadWidth * width / 2);
                        drawTesla(cX, cY, scale * 2500, '#111');
                    });
                    segment.sprites.forEach(sprite => {
                         let sX = segment.p1.screen.x + (scale * sprite.offset * roadWidth * width / 2);
                         if (sprite.type === 'SIGN') drawSign(sX, cY, scale * 2500);
                         else if (sprite.type === 'PERSON') drawPerson(sX, cY, scale * 2500, false);
                    });
                }
            }

            drawTesla(width / 2, height - 50, 1.7, '#fff', true); 

            if (raceState === 'FINISHED' && player.speed === 0) {
                 crowdSprites.forEach(p => {
                     drawPerson(p.x, p.y, p.scale, p.hasFlag);
                 });
            }

            let timeLeft = 0;
            if (raceState === 'RACING') {
                let limit = currentLap === 1 ? LAP1_LIMIT : LAP2_LIMIT;
                timeLeft = Math.max(0, limit - ((performance.now() - lapStartTime) / 1000));
            }
            
            drawDashboard(timeLeft);
            drawRearMirror();
            drawStartLights(); 

            if (currentLap === totalLaps && raceState === 'RACING' && (performance.now() - lapStartTime) < 2000) {
                 ctx.save();
                 ctx.textAlign = 'center';
                 ctx.fillStyle = (Math.floor(Date.now() / 200) % 2 === 0) ? '#ff0000' : '#ffff00';
                 ctx.font = '40px "Press Start 2P"';
                 ctx.strokeStyle = '#fff';
                 ctx.lineWidth = 4;
                 ctx.strokeText("FINAL LAP!", width/2, height/2);
                 ctx.fillText("FINAL LAP!", width/2, height/2);
                 ctx.restore();
            }

            // Draw Penalties / Warnings
            if (penaltyLabel) {
                 ctx.save();
                 ctx.textAlign = 'center';
                 ctx.fillStyle = (Math.floor(Date.now() / 200) % 2 === 0) ? '#ff0000' : '#ffff00';
                 ctx.font = '30px "Press Start 2P"';
                 ctx.strokeText(penaltyLabel, width/2, height/2 - 40);
                 ctx.fillText(penaltyLabel, width/2, height/2 - 40);
                 ctx.restore();
            } else if (lowGearTimer > 5) {
                 ctx.save();
                 ctx.textAlign = 'center';
                 ctx.fillStyle = (Math.floor(Date.now() / 100) % 2 === 0) ? '#ff0000' : '#ff8800';
                 ctx.font = '20px "Press Start 2P"';
                 ctx.fillText("OVER HEAT!", width/2, height/2 - 40);
                 ctx.restore();
            }
        }

        function frame() {
            let now = performance.now();
            let dt = Math.min(1, (now - lastTime) / 1000);
            update(dt);
            draw();
            lastTime = now;
            requestAnimationFrame(frame);
        }

        startBtn.onclick = () => {
            overlay.classList.add('hidden');
            overlay.classList.remove('victory-mode');
            paused = false;
            raceState = 'COUNTDOWN';
            raceStartTime = performance.now();
            countdownStep = 0;
            currentLap = 1;
            player.score = 0;
            player.speed = 0;
            player.x = 0;
            player.z = 0;
            player.gear = 'LOW'; 
            victoryPhase = 0;
            worldHeading = 0;
            lowGearTimer = 0;
            penaltyTimer = 0;
            penaltyLabel = "";
            
            resetTrack(); 
            addFinishLineDetails(); 
            
            lastTime = performance.now();
        };

        resetTrack();
        addFinishLineDetails();
        frame();
    </script>
</body>
