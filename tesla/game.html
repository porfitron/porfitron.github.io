<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Turbo - 16-Bit Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
        }
        body {
            margin: 0;
            padding: 0;
            background: #050505;
            font-family: 'Press Start 2P', cursive;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            border: 8px solid #333;
            border-radius: 4px;
            background: #000;
            image-rendering: pixelated; 
        }

        canvas {
            display: block;
            width: 800px; 
            height: 600px;
            background: #000;
            image-rendering: pixelated;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            text-shadow: 4px 4px 0px #000;
            font-size: 14px;
            z-index: 5;
        }

        #lap-timer {
            color: #ffcc00;
        }

        #gear-indicator {
            position: absolute;
            bottom: 30px;
            right: 30px;
            font-size: 16px;
            color: #fff;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border: 4px solid #fff;
            z-index: 5;
            transition: border-color 0.2s;
        }

        #controls-hint {
            position: absolute;
            bottom: 30px;
            left: 30px;
            font-size: 8px;
            color: #ccc;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border: 2px solid #555;
            line-height: 1.5;
            z-index: 5;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: var(--neon-blue);
            text-shadow: 4px 4px 0px var(--neon-pink);
        }

        .btn {
            background: var(--neon-pink);
            color: #fff;
            border: 4px solid #fff;
            padding: 20px 40px;
            font-size: 16px;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 4px 4px 0px #800080;
        }

        .btn:hover { background: #ff40ff; }
        .hidden { display: none !important; }
        
        .msg-box {
            background: #000;
            border: 4px solid white;
            padding: 20px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="300"></canvas>
        
        <div id="ui">
            <div>SPD:<span id="speed-val">0</span></div>
            <div id="lap-display">LAP 1</div>
            <div id="lap-timer">60.00</div>
            <div>SCORE:<span id="score-val">0</span></div>
        </div>

        <div id="gear-indicator">GEAR:LOW</div>

        <div id="controls-hint">
            STEER: ARROWS<br>
            GEAR : UP/DOWN<br>
            ACCEL: [X]  BRAKE: [Z]
        </div>

        <div id="overlay">
            <h1>TESLA TURBO</h1>
            <div class="msg-box" id="msg-content">
                <p>LAP 1: &lt; 60 SECONDS</p>
                <p>LAP 2: &lt; 55 SECONDS</p>
                <p style="font-size: 10px; color: #aaa;">LOW GEAR TURNS SHARP<br>HIGH GEAR SLIDES OUT</p>
            </div>
            <button class="btn" id="start-btn">INSERT COIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const speedVal = document.getElementById('speed-val');
        const scoreVal = document.getElementById('score-val');
        const lapDisplay = document.getElementById('lap-display');
        const lapTimer = document.getElementById('lap-timer');
        const gearInd = document.getElementById('gear-indicator');
        const overlay = document.getElementById('overlay');
        const msgContent = document.getElementById('msg-content');
        const startBtn = document.getElementById('start-btn');

        const width = 400;
        const height = 300;

        const roadWidth = 2000;
        const segmentLength = 200;
        const lanes = 3;
        const cameraHeight = 1000;
        const drawDistance = 200;
        const fieldOfView = 100;
        const cameraDepth = 1 / Math.tan((fieldOfView / 2) * Math.PI / 180);

        const maxSpeed = 25000;
        const accelLow = 5000;
        const accelHigh = 3500;
        const breaking = -15000;
        const decel = -2000;
        const offRoadDecel = -12000; 
        const offRoadLimit = 4000;    

        let player = { x: 0, z: 0, speed: 0, gear: 'LOW', score: 0, maxSpeed: 12000 };
        let keys = {};
        let segments = [];
        let cars = [];
        let trackLength = 0;
        let paused = true;
        let lastTime = performance.now();
        let skyOffset = 0;

        // Race State Variables
        let raceState = 'MENU'; // MENU, COUNTDOWN, RACING, FINISHED, GAMEOVER
        let raceStartTime = 0;
        let countdownStep = 0;
        
        // Lap Logic
        let currentLap = 1;
        let lapStartTime = 0;
        const LAP1_LIMIT = 60; // Increased to 60s
        const LAP2_LIMIT = 55; // Increased to 55s
        let totalLaps = 2;

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyX","KeyZ"].includes(e.code)) e.preventDefault();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function project(p, cameraX, cameraY, cameraZ) {
            // FIX: Render relative to camera offset to avoid Z=0 singularity
            p.camera.x = (p.world.x || 0) - cameraX;
            p.camera.y = (p.world.y || 0) - cameraY;
            p.camera.z = (p.world.z || 0) - cameraZ;
            
            const screenZ = Math.max(p.camera.z, 1);
            p.screen.scale = cameraDepth / screenZ;
            
            const rawX = (width / 2) + (p.screen.scale * p.camera.x * width / 2);
            const rawY = (height / 2) - (p.screen.scale * p.camera.y * height / 2);
            const rawW = (p.screen.scale * roadWidth * width / 2);

            p.screen.x = Math.round(Math.max(-5000, Math.min(5000, rawX)));
            p.screen.y = Math.round(Math.max(-5000, Math.min(5000, rawY)));
            p.screen.w = Math.round(Math.max(0, Math.min(5000, rawW)));
        }

        const findSegment = (z) => {
            const index = Math.floor(z / segmentLength) % segments.length;
            return segments[(index + segments.length) % segments.length];
        };

        function addSegment(curve, y) {
            let n = segments.length;
            segments.push({
                index: n,
                p1: { world: { y: lastY(), z: n * segmentLength }, camera: {}, screen: {} },
                p2: { world: { y: y, z: (n + 1) * segmentLength }, camera: {}, screen: {} },
                curve: curve,
                cars: [],
                sprites: [],
                color: Math.floor(n / 3) % 2 ? 
                    { road: '#444', grass: '#109110', rumble: '#fff', lane: '#fff' } : 
                    { road: '#333', grass: '#007000', rumble: '#f00', lane: '#333' }
            });
        }

        const lastY = () => segments.length > 0 ? segments[segments.length - 1].p2.world.y : 0;

        function addRoad(enter, hold, leave, curve, y) {
            let startY = lastY();
            let endY = startY + (y * segmentLength);
            let total = enter + hold + leave;
            for (let n = 0; n < enter; n++) addSegment(curve * (n/enter), startY + (endY-startY)*(n/total));
            for (let n = 0; n < hold; n++) addSegment(curve, startY + (endY-startY)*((enter+n)/total));
            for (let n = 0; n < leave; n++) addSegment(curve * (1-(n/leave)), startY + (endY-startY)*((enter+hold+n)/total));
        }

        function resetTrack() {
            segments = [];
            addRoad(50, 50, 50, 0, 0); // Start straight
            addRoad(200, 200, 200, 2, 15);
            addRoad(200, 200, 200, -2, -15);
            addRoad(200, 200, 200, 0, 0);
            addRoad(200, 200, 200, 3, 20); // Sharp turn
            addRoad(200, 200, 200, -4, -20); // Sharper turn
            addRoad(200, 200, 200, 0, 0); // Finish straight
            
            trackLength = segments.length * segmentLength;
            
            // Setup Start/Finish Lines
            for (let n = 0; n < 3; n++) {
                segments[n].color.road = '#fff'; // White Start Line
            }

            // Decorate
            segments.forEach((seg, i) => {
                // Random Signs
                if (i > 20 && i < segments.length - 50 && Math.random() < 0.025) {
                    seg.sprites.push({ type: 'SIGN', offset: Math.random() > 0.5 ? 1.3 : -1.3 });
                }
            });

            resetCars();
        }

        function addFinishLineDetails() {
            // Checkered Finish Line for end of lap
            for (let n = 0; n < 5; n++) {
                // We actually change the color dynamically during render for the checkered effect
                // but we can mark the segments here if we wanted specific logic
            }

            // Crowd at the finish
            let finishIndex = segments.length - 15;
            for (let n = 0; n < 15; n++) {
                let seg = segments[(finishIndex + n) % segments.length];
                // Left and right crowd
                seg.sprites.push({ type: 'PERSON', offset: -1.5 - (Math.random() * 0.5) });
                seg.sprites.push({ type: 'PERSON', offset: 1.5 + (Math.random() * 0.5) });
            }
        }

        function resetCars() {
            cars = [];
            for (let n = 0; n < 40; n++) {
                let offset = Math.random() * 0.8 * (Math.random() > 0.5 ? 1 : -1);
                let z = Math.floor(Math.random() * (segments.length - 100) + 50) * segmentLength;
                let car = { offset, z, speed: maxSpeed / 4 + Math.random() * maxSpeed / 2 };
                findSegment(z).cars.push(car);
                cars.push(car);
            }
        }

        function drawPolygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
            ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
            ctx.closePath();
            ctx.fill();
        }

        function drawSegment(segment) {
            let p1 = segment.p1;
            let p2 = segment.p2;

            ctx.fillStyle = segment.color.grass;
            ctx.fillRect(0, p2.screen.y, width, p1.screen.y - p2.screen.y);

            let r1 = p1.screen.w / 10;
            let r2 = p2.screen.w / 10;
            drawPolygon(p1.screen.x - p1.screen.w - r1, p1.screen.y, p1.screen.x - p1.screen.w, p1.screen.y, p2.screen.x - p2.screen.w, p2.screen.y, p2.screen.x - p2.screen.w - r2, p2.screen.y, segment.color.rumble);
            drawPolygon(p1.screen.x + p1.screen.w + r1, p1.screen.y, p1.screen.x + p1.screen.w, p1.screen.y, p2.screen.x + p2.screen.w, p2.screen.y, p2.screen.x + p2.screen.w + r2, p2.screen.y, segment.color.rumble);

            // Special Coloring for Finish Line on Final Lap or Start Line
            let roadColor = segment.color.road;
            if (segment.index < 3) {
                roadColor = '#fff'; // Start Line
            } else if (segment.index > segments.length - 6) {
                // Checkered finish
                let check = Math.floor((segment.index + (Date.now()/100)) % 2) === 0;
                roadColor = check ? '#fff' : '#000';
            }

            drawPolygon(p1.screen.x - p1.screen.w, p1.screen.y, p1.screen.x + p1.screen.w, p1.screen.y, p2.screen.x + p2.screen.w, p2.screen.y, p2.screen.x - p2.screen.w, p2.screen.y, roadColor);

            if (segment.color.lane && segment.index % 4 === 0 && segment.index > 5 && segment.index < segments.length - 10) {
                let l1 = p1.screen.w / 30;
                let l2 = p2.screen.w / 30;
                let lanew = p1.screen.w * 2 / lanes;
                let lx1 = p1.screen.x - p1.screen.w + lanew;
                let lx2 = p2.screen.x - p2.screen.w + lanew;
                for (let i = 1; i < lanes; lx1 += lanew, lx2 += lanew, i++) {
                    drawPolygon(lx1 - l1, p1.screen.y, lx1 + l1, p1.screen.y, lx2 + l2, p2.screen.y, lx2 - l2, p2.screen.y, segment.color.lane);
                }
            }
        }

        function drawSign(x, y, scale) {
            if (scale <= 0) return;
            let w = 40 * scale;
            let h = 80 * scale;
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = '#8b4513'; ctx.fillRect(-w/8, -h, w/4, h);
            ctx.fillStyle = '#ff0000'; ctx.fillRect(-w/2, -h, w, w); 
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * (scale * 5); ctx.strokeRect(-w/2, -h, w, w);
            ctx.restore();
        }

        function drawPerson(x, y, scale) {
            if (scale <= 0) return;
            let w = 15 * scale;
            let h = 30 * scale;
            let jump = (Date.now() % 500) > 250 ? 5 * scale : 0; // Simple jumping anim

            ctx.save();
            ctx.translate(x, y - jump);
            // Head
            ctx.fillStyle = '#ffccaa';
            ctx.beginPath(); ctx.arc(0, -h, w/2, 0, Math.PI*2); ctx.fill();
            // Body
            ctx.fillStyle = Math.random() > 0.5 ? '#00f' : '#0f0'; // Random shirt color flicker (lazy crowd effect)
            ctx.fillRect(-w/2, -h, w, h*0.6);
            // Legs
            ctx.fillStyle = '#222';
            ctx.fillRect(-w/2, -h*0.4, w/2.2, h*0.4);
            ctx.fillRect(0, -h*0.4, w/2.2, h*0.4);
            ctx.restore();
        }

        function drawTesla(x, y, scale, color, isPlayer = false) {
            if (scale <= 0) return;
            let w = 80 * scale;
            let h = 40 * scale;
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(-w/2, 0); ctx.lineTo(-w/2, -h*0.4);
            ctx.lineTo(-w*0.3, -h); ctx.lineTo(w*0.3, -h);
            ctx.lineTo(w/2, -h*0.4); ctx.lineTo(w/2, 0);
            ctx.fill();
            ctx.fillStyle = 'rgba(17, 17, 17, 0.4)'; 
            ctx.fillRect(-w*0.2, -h*0.8, w*0.4, h*0.4);
            ctx.fillStyle = isPlayer ? '#f00' : '#300';
            ctx.fillRect(-w*0.45, -h*0.35, w*0.15, h*0.15);
            ctx.fillRect(w*0.3, -h*0.35, w*0.15, h*0.15);
            ctx.restore();
        }

        function drawSignalLights() {
            if (raceState !== 'COUNTDOWN' && (raceState !== 'RACING' || (performance.now() - raceStartTime) > 5000)) return;
            let y = height / 4;
            let spacing = 60;
            let startX = width / 2 - spacing;
            ctx.fillStyle = '#000'; ctx.fillRect(startX - 50, y - 40, spacing * 2 + 100, 80);
            ctx.strokeStyle = '#555'; ctx.lineWidth = 4; ctx.strokeRect(startX - 50, y - 40, spacing * 2 + 100, 80);
            for (let i = 0; i < 3; i++) {
                let x = startX + (i * spacing);
                let color = '#330000'; 
                if (countdownStep < 4) { if (i < countdownStep) color = '#ff0000'; } else { color = '#00ff00'; }
                ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2); ctx.fill();
                if ((countdownStep < 4 && i < countdownStep) || countdownStep === 4) {
                    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(x - 5, y - 5, 5, 0, Math.PI * 2); ctx.fill();
                }
            }
        }

        function drawSky() {
            let grad = ctx.createLinearGradient(0, 0, 0, height/2);
            grad.addColorStop(0, '#001a33'); grad.addColorStop(1, '#ff6600');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height/2);
            ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(width * 0.7, height * 0.25, 25, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#1a0033';
            for(let i = -1; i < 3; i++) {
                let sX = (i * width) - (skyOffset % width);
                ctx.beginPath();
                ctx.moveTo(sX, height/2); ctx.lineTo(sX + width*0.3, height/2-40); ctx.lineTo(sX + width*0.6, height/2);
                ctx.fill();
            }
        }

        function update(dt) {
            if (paused) return;

            // --- COUNTDOWN LOGIC ---
            if (raceState === 'COUNTDOWN') {
                let elapsed = (performance.now() - raceStartTime) / 1000;
                if (elapsed < 1) countdownStep = 1;
                else if (elapsed < 2) countdownStep = 2;
                else if (elapsed < 3) countdownStep = 3;
                else {
                    countdownStep = 4;
                    raceState = 'RACING';
                    lapStartTime = performance.now(); // Start timer
                }
            }

            // --- LAP LOGIC ---
            if (raceState === 'RACING') {
                let elapsed = (performance.now() - lapStartTime) / 1000;
                let limit = currentLap === 1 ? LAP1_LIMIT : LAP2_LIMIT;
                let remaining = Math.max(0, limit - elapsed);
                lapTimer.innerText = remaining.toFixed(2);
                lapDisplay.innerText = "LAP " + currentLap;

                if (remaining <= 0) {
                    raceState = 'GAMEOVER';
                    overlay.classList.remove('hidden');
                    document.querySelector('h1').innerText = "TOO SLOW";
                    msgContent.innerHTML = "<p>YOU RAN OUT OF TIME</p>";
                    startBtn.innerText = "TRY AGAIN";
                    return;
                }
            }

            let playerSegment = findSegment(player.z);
            
            // --- PHYSICS ENGINE ---
            let speedRatio = player.speed / maxSpeed;
            
            // Centrifugal Force: Grows with square of speed
            // Pushes car opposite to curve direction
            let centrifugalForce = (speedRatio * speedRatio) * playerSegment.curve * 3.2 * dt;
            player.x -= centrifugalForce;

            // Steering Authority: Linear with speed
            // Stronger than centrifugal at low speed, weaker at high speed
            let steerInput = dt * 7.0 * speedRatio;

            if (keys['ArrowLeft']) player.x -= steerInput; 
            if (keys['ArrowRight']) player.x += steerInput; 
            
            if (keys['ArrowUp']) { 
                player.gear = 'HIGH'; player.maxSpeed = 25000;
                gearInd.innerText = "GEAR:HIGH"; gearInd.style.borderColor = "var(--neon-blue)";
            }
            if (keys['ArrowDown']) { 
                player.gear = 'LOW'; player.maxSpeed = 12000;
                gearInd.innerText = "GEAR:LOW"; gearInd.style.borderColor = "#fff";
            }

            if (raceState === 'RACING') {
                if (keys['KeyX']) player.speed += (player.gear === 'LOW' ? accelLow : accelHigh) * dt;
                else if (keys['KeyZ']) player.speed += breaking * dt;
                else player.speed += decel * dt;
            } else if (raceState !== 'FINISHED') {
                player.speed = 0; 
            } else {
                player.speed += decel * dt; // Coast to stop
            }

            if ((player.x < -1 || player.x > 1)) {
                 if (player.speed > offRoadLimit) {
                     player.speed += offRoadDecel * dt;
                 }
            }

            player.speed = Math.min(Math.max(player.speed, 0), player.maxSpeed);
            
            // Lap Crossing Logic
            let oldZ = player.z;
            player.z += player.speed * dt;
            
            if (player.z >= trackLength) {
                // Cross Finish Line
                player.z -= trackLength;
                if (raceState === 'RACING') {
                    if (currentLap < totalLaps) {
                        currentLap++;
                        lapStartTime = performance.now(); // Reset timer for lap 2
                    } else {
                        // WIN!
                        raceState = 'FINISHED';
                        overlay.classList.remove('hidden');
                        document.querySelector('h1').innerText = "VICTORY";
                        msgContent.innerHTML = "<p>GREAT DRIVING!</p><p>SCORE: " + player.score + "</p>";
                        startBtn.innerText = "PLAY AGAIN";
                    }
                }
            }
            
            player.x = Math.min(Math.max(player.x, -3), 3);

            if (playerSegment.sprites) {
                playerSegment.sprites.forEach(sprite => {
                    if (Math.abs(player.x - sprite.offset) < 0.3) {
                        player.speed = 0; 
                    }
                });
            }

            cars.forEach(car => {
                let oldS = findSegment(car.z);
                car.z += car.speed * dt;
                if (car.z > trackLength) car.z -= trackLength;
                let newS = findSegment(car.z);
                if (oldS !== newS) {
                    oldS.cars.splice(oldS.cars.indexOf(car), 1);
                    newS.cars.push(car);
                }
                if (Math.abs(player.z - car.z) < 250 && Math.abs(player.x - car.offset) < 0.4) {
                    player.speed *= 0.5;
                    player.z = car.z - 251;
                }
            });

            skyOffset += playerSegment.curve * speedRatio * 60;
            speedVal.innerText = Math.round(player.speed / 100);
            if (raceState === 'RACING') player.score += Math.round(player.speed / 2500);
            scoreVal.innerText = player.score;
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            drawSky();
            ctx.fillStyle = '#007000'; ctx.fillRect(0, height/2, width, height/2);

            let baseSegment = findSegment(player.z);
            let basePercent = (player.z % segmentLength) / segmentLength;
            let playerY = baseSegment.p1.world.y + (baseSegment.p2.world.y - baseSegment.p1.world.y) * basePercent;
            
            let x = 0, dx = - (baseSegment.curve * basePercent);
            
            // FIX: Render camera 150 units BEHIND player.z to avoid z=0 clipping/disappearing road
            let cameraZOffset = 150; 

            for (let n = 0; n < drawDistance; n++) {
                let segment = segments[(baseSegment.index + n) % segments.length];
                segment.looped = segment.index < baseSegment.index;
                
                // Pass cameraZ as player.z - offset
                project(segment.p1, player.x * roadWidth - x, playerY + cameraHeight, player.z - (segment.looped ? trackLength : 0) - cameraZOffset);
                project(segment.p2, player.x * roadWidth - x - dx, playerY + cameraHeight, player.z - (segment.looped ? trackLength : 0) - cameraZOffset);
                x += dx; dx += segment.curve;
            }

            for (let n = drawDistance - 1; n >= 0; n--) {
                let segment = segments[(baseSegment.index + n) % segments.length];
                if (segment.p2.screen.y >= segment.p1.screen.y) continue;
                drawSegment(segment);
            }

            for (let n = drawDistance - 1; n > 0; n--) {
                let segment = segments[(baseSegment.index + n) % segments.length];
                let scale = segment.p1.screen.scale;
                let cY = segment.p1.screen.y;

                if (cY > height/2 && cY < height && scale > 0) {
                    segment.cars.forEach(car => {
                        let cX = segment.p1.screen.x + (scale * car.offset * roadWidth * width / 2);
                        drawTesla(cX, cY, scale * 2500, '#111');
                    });
                    
                    segment.sprites.forEach(sprite => {
                         let sX = segment.p1.screen.x + (scale * sprite.offset * roadWidth * width / 2);
                         if (sprite.type === 'SIGN') {
                             drawSign(sX, cY, scale * 2500);
                         } else if (sprite.type === 'PERSON') {
                             drawPerson(sX, cY, scale * 2500);
                         }
                    });
                }
            }

            drawTesla(width / 2, height - 10, 2.7, '#fff', true);
            drawSignalLights();
        }

        function frame() {
            let now = performance.now();
            let dt = Math.min(1, (now - lastTime) / 1000);
            update(dt);
            draw();
            lastTime = now;
            requestAnimationFrame(frame);
        }

        startBtn.onclick = () => {
            overlay.classList.add('hidden');
            paused = false;
            raceState = 'COUNTDOWN';
            raceStartTime = performance.now();
            countdownStep = 0;
            currentLap = 1;
            player.score = 0;
            player.speed = 0;
            player.x = 0;
            player.z = 0;
            
            resetTrack(); // Re-gen track to ensure signs/crowd are reset
            addFinishLineDetails(); // Add crowd to finish
            
            lastTime = performance.now();
        };

        resetTrack();
        addFinishLineDetails();
        frame();
    </script>
</body>
</html>
