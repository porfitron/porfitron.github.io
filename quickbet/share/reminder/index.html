    <script>
        (function redirectToAcceptFlow() {
            const incoming = new URL(window.location.href);
            const path = incoming.pathname;
            const shareIdx = path.indexOf("/share/");
            const base = shareIdx >= 0 ? path.slice(0, shareIdx).replace(/\/+$/, "") : "";
            const targetPath = base === "" ? "/" : `${base}/`;
            const next = new URL(targetPath, incoming.origin);
            next.search = incoming.search;
            next.hash = incoming.hash;
            window.location.replace(next.toString());
        })();
